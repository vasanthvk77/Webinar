<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>Header</div>


    <div id="parent1">

        <!-- Left Section -->
        <div id="parent2" class="card">
            <h1>210<span>+</span></h1>

            <div class="content">
                <h2>Projects completed</h2>
                <p>
                    We design how light moves through space for
                    architects, developers, and homeowners.
                </p>
            </div>
        </div>

        <!-- Middle Section -->
        <div id="middle" class="card">
            <h1>MIDDLE TEXT</h1>
        </div>

        <!-- Right Section -->
        <div id="parent3" class="card">
            <h1>15<span>Y+</span></h1>

            <div class="content">
                <h2>Years in practice</h2>
                <p>
                    With years of experience in the industry,
                    we bring a wealth of knowledge and skills.
                </p>
            </div>
        </div>

    </div>

    <div id="footer">Footer</div>

    <style>
        * {
            box-sizing: border-box;
        }

        #parent1 {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .card {
            flex: 1;
            min-width: 0;
            height: 500px;
            padding: 40px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #parent2,
        #parent3 {
            background-color: #f7f5ed;
            border: 1px solid #e8e4d8;
        }

        #parent2 h1,
        #parent3 h1 {
            margin: 0;
            font-size: 64px;
            font-weight: bold;
        }

        #parent2 h1 span,
        #parent3 h1 span {
            color: #999;
        }

        .content h2 {
            font-size: 30px;
            font-weight: 500;
            margin: 0 0 20px;
        }

        .content p {
            font-size: 20px;
            line-height: 1.5;
            margin: 0;
        }

        #middle {
            background-color: #25232a;
            color: white;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #footer {
            padding: 20px;
            text-align: center;
        }

        /* Responsive layout */
        @media (max-width: 768px) {
            #parent1 {
                flex-direction: column;
            }

            .card {
                width: 100%;
                height: 400px;
            }
        }
    </style>

</body>

</html>
